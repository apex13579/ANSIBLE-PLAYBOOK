```yaml
---
# SweattLabs - AI Host Variables

# Host identity
ai_hostname: ai01
ai_management_ip: 10.10.50.10
ai_domain: sweatt.lab

# Platform
ai_platform: debian
ai_hardware: Dell OptiPlex 3040 MT
ai_role: ai

# Connection
ansible_connection: ssh
ansible_python_interpreter: auto_silent

# Compute
ai_use_cpu_inference: true
ai_use_gpu_inference: false
ai_use_all_available_cpu_cores: true

# Storage
ai_os_disk_gb: 100

# Applications
ai_manage_docker: true
ai_manage_llama: true
ai_manage_gobonet: true
ai_manage_n8n: true

# Security
ai_manage_firewall: true
ai_validate_tls: true
```

